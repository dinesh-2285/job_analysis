services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    env_file:
      - .env.dev
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
